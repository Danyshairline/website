<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dany's Hairline | Friseur & Kosmetik Marburg</title>

    <meta name="description"
          content="Dany's Hairline – Friseur & Kosmetik in Marburg. Neueröffnung am 05.09.2026 in der Zwischenhausen 6, 35037 Marburg.">

    <style>

        /* =========================
           GRUNDEINSTELLUNGEN
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            overflow-x: hidden;
        }


        /* =========================
           STARTSEITE
        ========================== */

        .hero {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            padding: 20px;
        }


        /* =========================
           BILD
        ========================== */

        .hero-image {
            display: block;

            width: 100%;
            max-width: 1700px;

            height: auto;

            opacity: 0;

            transform:
                translateY(35px)
                scale(0.97);

            filter: blur(5px);

            animation:
                heroEntrance 1.5s
                cubic-bezier(0.22, 1, 0.36, 1)
                forwards;
        }


        /* =========================
           START-ANIMATION
        ========================== */

        @keyframes heroEntrance {

            0% {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.97);

                filter: blur(5px);
            }

            60% {
                opacity: 1;
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            background: #000;

            text-align: center;

            padding:
                30px
                20px
                40px;

            font-size: 13px;

            letter-spacing: 1px;

            color: #777;
        }

        footer span {
            color: #c9a227;
        }


        /* =========================
           HANDY
        ========================== */

        @media (max-width: 768px) {

            .hero {
                min-height: auto;

                padding:
                    40px
                    10px;
            }

            .hero-image {
                width: 100%;
            }

            footer {
                padding-bottom: 30px;

                font-size: 11px;
            }
        }


        /* Animation deaktivieren,
           wenn Nutzer reduzierte
           Bewegungen eingestellt hat */

        @media (prefers-reduced-motion: reduce) {

            .hero-image {
                animation: none;

                opacity: 1;

                transform: none;

                filter: none;
            }
        }

    </style>

</head>


<body>


    <main>

        <section class="hero">

            <img
                src="startseite.png"
                alt="Dany's Hairline – Neueröffnung am 05.09.2026"
                class="hero-image"
            >

        </section>

    </main>


    <footer>

        © 2026
        <span>Dany's Hairline</span>
        · Friseur & Kosmetik · Marburg

    </footer>


</body>

</html>
